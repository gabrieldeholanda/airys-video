apiVersion: monitoring.googleapis.com/v1
kind: MonitoringConfig
metadata:
  name: airys-video-test-monitoring
spec:
  metrics:
    # CPU Utilization
    - name: "run.googleapis.com/container/cpu/utilization"
      displayName: "CPU Utilization"
      filter: |
        resource.type = "cloud_run_revision"
        resource.labels.service_name = "airys-video-test"
      metricKind: GAUGE
      valueType: DOUBLE
      alerting:
        threshold: 0.8
        duration: "300s"
        comparison: COMPARISON_GT

    # Memory Utilization
    - name: "run.googleapis.com/container/memory/utilization"
      displayName: "Memory Utilization"
      filter: |
        resource.type = "cloud_run_revision"
        resource.labels.service_name = "airys-video-test"
      metricKind: GAUGE
      valueType: DOUBLE
      alerting:
        threshold: 0.85
        duration: "300s"
        comparison: COMPARISON_GT

    # GPU Utilization
    - name: "run.googleapis.com/container/gpu/utilization"
      displayName: "GPU Utilization"
      filter: |
        resource.type = "cloud_run_revision"
        resource.labels.service_name = "airys-video-test"
      metricKind: GAUGE
      valueType: DOUBLE
      alerting:
        threshold: 0.9
        duration: "300s"
        comparison: COMPARISON_GT

    # Request Latency
    - name: "run.googleapis.com/request_latencies"
      displayName: "Request Latency"
      filter: |
        resource.type = "cloud_run_revision"
        resource.labels.service_name = "airys-video-test"
      metricKind: DISTRIBUTION
      valueType: DISTRIBUTION
      alerting:
        threshold: 2000
        duration: "300s"
        comparison: COMPARISON_GT

    # Error Rate
    - name: "run.googleapis.com/request_count"
      displayName: "Error Rate"
      filter: |
        resource.type = "cloud_run_revision"
        resource.labels.service_name = "airys-video-test"
        metric.labels.response_code_class = "5xx"
      metricKind: DELTA
      valueType: INT64
      alerting:
        threshold: 5
        duration: "300s"
        comparison: COMPARISON_GT

  dashboards:
    - name: "airys-video-test-overview"
      displayName: "Airys Video Test Overview"
      rowLayout:
        - widgets:
            - title: "CPU Utilization"
              xyChart:
                dataSets:
                  - timeSeriesQuery:
                      timeSeriesFilter:
                        filter: |
                          metric.type = "run.googleapis.com/container/cpu/utilization"
                          resource.type = "cloud_run_revision"
                          resource.labels.service_name = "airys-video-test"
            
            - title: "Memory Usage"
              xyChart:
                dataSets:
                  - timeSeriesQuery:
                      timeSeriesFilter:
                        filter: |
                          metric.type = "run.googleapis.com/container/memory/utilization"
                          resource.type = "cloud_run_revision"
                          resource.labels.service_name = "airys-video-test"
            
            - title: "GPU Utilization"
              xyChart:
                dataSets:
                  - timeSeriesQuery:
                      timeSeriesFilter:
                        filter: |
                          metric.type = "run.googleapis.com/container/gpu/utilization"
                          resource.type = "cloud_run_revision"
                          resource.labels.service_name = "airys-video-test"

  logging:
    logMetrics:
      - name: "gpu-errors"
        filter: |
          resource.type = "cloud_run_revision"
          resource.labels.service_name = "airys-video-test"
          textPayload:("NVIDIA" AND "error")
        metricDescriptor:
          metricKind: DELTA
          valueType: INT64
          unit: "1"
          displayName: "GPU Errors"

      - name: "storage-errors"
        filter: |
          resource.type = "cloud_run_revision"
          resource.labels.service_name = "airys-video-test"
          textPayload:("storage" AND "error")
        metricDescriptor:
          metricKind: DELTA
          valueType: INT64
          unit: "1"
          displayName: "Storage Errors"

  alertPolicies:
    - displayName: "High Resource Utilization"
      conditions:
        - displayName: "High CPU Usage"
          condition: |
            resource.type = "cloud_run_revision"
            resource.labels.service_name = "airys-video-test"
            metric.type = "run.googleapis.com/container/cpu/utilization"
            condition.threshold = 0.8
            condition.comparison = "COMPARISON_GT"
            condition.duration = "300s"
        
        - displayName: "High Memory Usage"
          condition: |
            resource.type = "cloud_run_revision"
            resource.labels.service_name = "airys-video-test"
            metric.type = "run.googleapis.com/container/memory/utilization"
            condition.threshold = 0.85
            condition.comparison = "COMPARISON_GT"
            condition.duration = "300s"
        
        - displayName: "High GPU Usage"
          condition: |
            resource.type = "cloud_run_revision"
            resource.labels.service_name = "airys-video-test"
            metric.type = "run.googleapis.com/container/gpu/utilization"
            condition.threshold = 0.9
            condition.comparison = "COMPARISON_GT"
            condition.duration = "300s"

      notificationChannels:
        - type: "email"
          labels:
            email_address: "ops@airys.com.br" 