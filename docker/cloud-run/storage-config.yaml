resources:
  - type: storage.v1.bucket
    name: airys-video-storage
    properties:
      location: us-central1
      storageClass: STANDARD
      versioning:
        enabled: true
      lifecycle:
        rule:
          - action:
              type: Delete
            condition:
              age: 30
              isLive: false
          - action:
              type: SetStorageClass
              storageClass: NEARLINE
            condition:
              age: 90
              matchesStorageClass: ["STANDARD"]
      iamConfiguration:
        uniformBucketLevelAccess:
          enabled: true
      labels:
        environment: production
        service: airys-video

  - type: storage.v1.bucket
    name: airys-video-models
    properties:
      location: us-central1
      storageClass: STANDARD
      versioning:
        enabled: true
      lifecycle:
        rule:
          - action:
              type: SetStorageClass
              storageClass: NEARLINE
            condition:
              age: 90
              matchesStorageClass: ["STANDARD"]
      iamConfiguration:
        uniformBucketLevelAccess:
          enabled: true
      labels:
        environment: production
        service: airys-video-models

  - type: storage.v1.bucket
    name: airys-video-temp
    properties:
      location: us-central1
      storageClass: STANDARD
      versioning:
        enabled: false
      lifecycle:
        rule:
          - action:
              type: Delete
            condition:
              age: 1
      iamConfiguration:
        uniformBucketLevelAccess:
          enabled: true
      labels:
        environment: production
        service: airys-video-temp 